name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bot.py configure.py build.py
      - run: bash -n install.sh
      - run: python build.py
      - run: bash -n dist/setup-wg-telegram.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wg-telegram-installers
          path: dist/*
